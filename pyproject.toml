[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "observatorio-qualidade-transporte-aereo"
version = "0.1.0"
description = "Pipeline auditável de dados abertos do VRA/ANAC"
requires-python = ">=3.11"
dependencies = ["duckdb==1.4.3", "pyarrow==22.0.0", "dbt-core==1.10.15", "dbt-duckdb==1.10.0"]

[project.optional-dependencies]
bigquery = ["dbt-bigquery==1.10.3"]
dev = ["pytest==8.4.2", "ruff==0.14.3", "nbformat==5.10.4", "nbclient==0.10.2", "ipykernel>=6,<8"]

[project.scripts]
observatorio = "observatorio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
